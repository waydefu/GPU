name: Governance & Hygiene Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check HANDOFF.md line budget (<= 150 lines)
        run: |
          lines=$(wc -l < HANDOFF.md)
          echo "HANDOFF.md lines: $lines"
          test "$lines" -le 150

      - name: Check active script syntax
        run: |
          bash -n scripts/zlogs-safe.sh
          python3 -m py_compile patches/run_tiny_pixmap.py

      - name: Run governance and safety regression tests
        run: |
          python3 scripts/test-zlogs-safe.py
          python3 scripts/test-governance.py

      - name: Run Hybrid 2.0 regression tests
        timeout-minutes: 3
        run: python3 -B scripts/test_f8_hybrid2.py

      - name: Block sensitive content in active files
        run: python3 scripts/check-governance.py scan

      - name: Protect published and frozen evidence
        env:
          COMPARE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-governance.py freeze
