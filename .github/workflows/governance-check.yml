name: Governance & Hygiene Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check HANDOFF.md line budget (<= 150 lines)
        run: |
          lines=$(wc -l < HANDOFF.md)
          echo "HANDOFF.md lines: $lines"
          test "$lines" -le 150

      - name: Check active script syntax
        run: |
          bash -n scripts/zlogs-safe.sh
          python3 -m py_compile patches/run_tiny_pixmap.py

      - name: Verify log compression preserves source files on failure
        run: python3 scripts/test-zlogs-safe.py

      - name: Block leaked local session paths, secrets, and hardcoded ADB endpoints in active files
        shell: bash
        run: |
          targets=(HANDOFF.md AGENTS.md WORKTREE-MAP.md README.md TEST-MATRIX.md .claude/rules/gpu-structure.md scripts/ patches/run_tiny_pixmap.py)
          reject_matches() {
            local pattern=$1 message=$2 status
            if grep -rIlE -- "$pattern" "${targets[@]}"; then
              echo "::error::$message"
              return 1
            else
              status=$?
              if (( status != 1 )); then
                echo "::error::Content scan failed (grep exit $status)"
                return "$status"
              fi
            fi
          }
          reject_matches '(/root/\.gemini/|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AIza[0-9A-Za-z_-]{35})' \
            'Local Antigravity path or credential-like string detected'
          reject_matches '(10\.191\.[0-9]+\.[0-9]+:[0-9]+|192\.168\.[0-9]+\.[0-9]+:[0-9]+)' \
            'Hardcoded ADB LAN endpoint in active authority or scripts'

      - name: Protect frozen Gate A evidence on PRs
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          : "${PR_BASE_SHA:?Missing pull request base SHA}"
          if ! git merge-base --is-ancestor "$PR_BASE_SHA" HEAD; then
            echo "::error::Could not verify the PR base against the checked-out merge commit"
            exit 1
          fi
          if ! git diff --exit-code --name-status --no-renames "$PR_BASE_SHA" HEAD -- evidence/session/gate-a-a1/; then
            echo "::error::Frozen Gate A evidence changed or the comparison failed"
            exit 1
          fi
